version = 1
SPDX-PackageName = "NextcloudUI SwiftUI component library"
SPDX-PackageSupplier = "Nextcloud GmbH <https://nextcloud.com/impressum/>"
SPDX-PackageDownloadLocation = "https://github.com/hamza221/nextcloud-swiftui"

# Path globs rather than per-file .license sidecars: `reuse lint` walks every
# file, and sidecars would make it the slowest job in CI.

[[annotations]]
path = [
    ".gitignore",
    ".xcode-version",
    ".swift-format",
    "Package.resolved",
    # One icon name per line: the generator reads every non-blank line as a
    # name, so a comment header would become a bogus icon.
    "Scripts/icon-manifest.txt",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Nextcloud GmbH and Nextcloud contributors"
SPDX-License-Identifier = "CC0-1.0"

# Asset catalogues, string catalogues and Xcode project files cannot carry a
# comment header.
[[annotations]]
path = [
    "Sources/**/*.xcassets/**",
    "Sources/**/*.xcstrings",
    "Showcase/**/*.pbxproj",
    "Showcase/**/*.plist",
    "Showcase/**/*.xcscheme",
    ".swiftpm/**",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Nextcloud GmbH and Nextcloud contributors"
SPDX-License-Identifier = "AGPL-3.0-or-later"

# A DocC catalogue page must open with its symbol heading, so it cannot carry a
# comment header without breaking the symbol association.
[[annotations]]
path = "Sources/**/*.docc/**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Nextcloud GmbH and Nextcloud contributors"
SPDX-License-Identifier = "AGPL-3.0-or-later"

# A DocC extension file must open with the symbol it documents, for the same
# reason as the catalogue pages above. CONTRIBUTING puts these next to the source
# rather than in the catalogue, so they need their own glob.
[[annotations]]
path = "Sources/NextcloudUI/Components/**/*.md"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Nextcloud GmbH and Nextcloud contributors"
SPDX-License-Identifier = "AGPL-3.0-or-later"

# Visual regression baselines are generated artefacts.
[[annotations]]
path = "Tests/NextcloudUISnapshotTests/__Snapshots__/**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Nextcloud GmbH and Nextcloud contributors"
SPDX-License-Identifier = "AGPL-3.0-or-later"

# Test vectors ported verbatim from @nextcloud/vue, so that the same person gets
# the same avatar colour in the web and native clients.
[[annotations]]
path = "Tests/NextcloudDesignTests/Fixtures/**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2020-2026 Nextcloud GmbH and Nextcloud contributors"
SPDX-License-Identifier = "AGPL-3.0-or-later"
