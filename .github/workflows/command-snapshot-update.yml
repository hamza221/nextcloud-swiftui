name: Update snapshots

# Mirrors @nextcloud/vue's command-playwright-update.yml. Without a one-comment
# rebaseline, full visual coverage becomes unworkable within about a week:
# baselines must be recorded on the runner image, so a contributor has no way to
# regenerate them from a laptop.
on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write

jobs:
  rebaseline:
    name: Re-record baselines
    if: >
      github.event.issue.pull_request &&
      contains(github.event.comment.body, '/update-snapshots') &&
      (github.event.comment.author_association == 'OWNER' ||
       github.event.comment.author_association == 'MEMBER' ||
       github.event.comment.author_association == 'COLLABORATOR')
    runs-on: macos-26
    steps:
      - name: Acknowledge
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: 'rocket',
            })

      - name: Resolve the pull request head
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            })
            core.setOutput('ref', pr.data.head.ref)
            core.setOutput('repo', pr.data.head.repo.full_name)

      - uses: actions/checkout@v4
        with:
          repository: ${{ steps.pr.outputs.repo }}
          ref: ${{ steps.pr.outputs.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - id: xcode
        run: echo "version=$(cat .xcode-version)" >> "$GITHUB_OUTPUT"
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ steps.xcode.outputs.version }}

      - name: Re-record
        env:
          SNAPSHOT_TESTING_RECORD: all
        # Recording always "fails" the assertions it rewrites, which is expected.
        run: swift test --filter NextcloudUISnapshotTests || true

      - name: Commit the new baselines
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -- '**/__Snapshots__/**'
          if git diff --cached --quiet; then
            echo "Baselines already current; nothing to push."
            exit 0
          fi
          git commit -m 'test(ui): re-record visual regression baselines'
          git push
