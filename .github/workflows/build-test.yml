name: Build and test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Read the pinned Xcode version
        id: xcode
        # Unpinned Xcode is the top cause of "CI broke and nobody changed
        # anything", and it is fatal to visual regression baselines.
        run: echo "version=$(cat .xcode-version)" >> "$GITHUB_OUTPUT"

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ steps.xcode.outputs.version }}

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ steps.xcode.outputs.version }}-${{ hashFiles('Package.swift', 'Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-${{ steps.xcode.outputs.version }}-

      - name: Build
        # `-Xswiftc -warnings-as-errors` rather than
        # `.treatAllWarnings(as: .error)` in Package.swift: the manifest setting
        # collides with the `-suppress-warnings` Xcode gives every package
        # target, which breaks every app that depends on us. This job is the
        # only thing that keeps warnings fatal now, so keep the flag on both
        # steps.
        run: swift build --build-tests -Xswiftc -warnings-as-errors

      - name: Test
        # The snapshot suite runs in its own workflow so that a pixel difference
        # never masks a logic failure.
        run: swift test --skip NextcloudUISnapshotTests -Xswiftc -warnings-as-errors

  api-breakage:
    name: API breaking changes
    runs-on: macos-26
    # Informational: a breaking change is often intentional before 1.0. This
    # reports it rather than blocking on it.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: xcode
        run: echo "version=$(cat .xcode-version)" >> "$GITHUB_OUTPUT"
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ steps.xcode.outputs.version }}
      - name: Compare against the last tag
        run: |
          tag=$(git describe --tags --abbrev=0 2>/dev/null || true)
          if [ -z "$tag" ]; then
            echo "No tag yet; nothing to compare against."
            exit 0
          fi
          swift package diagnose-api-breaking-changes "$tag"
