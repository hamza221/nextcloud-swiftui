name: PR title

# Squash-merge makes the pull request title the commit subject, so the title is
# what has to satisfy Conventional Commits -- not the individual commits.
on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize]

permissions:
  pull-requests: read

jobs:
  conventional-commit:
    name: Conventional Commits
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
          scopes: |
            design
            icons
            platform
            ui
            showcase
            docs
            ci
            deps
            avatar
            chip
            counter-bubble
            highlight
            list-item
            navigation
            note-card
            user-picker
            user-status
          requireScope: false
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: |
            The subject "{subject}" should start with a lowercase letter.
